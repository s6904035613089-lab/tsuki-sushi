<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>สั่งอาหาร | Tsuki Sushi 🌙</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#151a33">
<link rel="icon" href="assets/images/logo-mark.svg">
<link href="assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body style="padding-bottom:86px">

<!-- ============================================ หัวหน้าจอ -->
<header class="cust-hero">
  <div class="container">
    <div class="d-flex justify-content-between align-items-start">
      <img src="assets/images/logo.svg" alt="Tsuki Sushi" style="height:44px">
      <div class="text-end">
        <div class="table-chip" id="tableChip">กำลังโหลด…</div>
        <div class="small text-white-50 mt-1" id="sessionMeta"></div>
      </div>
    </div>
    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-outline-light btn-sm flex-fill" onclick="openOrders()">
        🧾 ออเดอร์ของฉัน <span class="badge bg-light text-dark ms-1" id="ordersBadge">0</span>
      </button>
      <button class="btn btn-light btn-sm flex-fill" onclick="askBill()" id="btnBill">💳 เรียกเก็บเงิน</button>
    </div>
  </div>
</header>
<div class="divider-wave"></div>

<!-- ============================================ เนื้อหา -->
<main class="container" id="main">
  <div class="spinner-t"></div>
</main>

<!-- ============================================ แถบตะกร้าลอย -->
<div class="cart-bar" id="cartBar">
  <div class="container d-flex align-items-center gap-3">
    <div class="flex-grow-1">
      <div style="font-size:.78rem;opacity:.7" id="cartCount">0 รายการ</div>
      <div style="font-family:Poppins,sans-serif;font-weight:600;font-size:1.25rem" id="cartTotal">฿0</div>
    </div>
    <button class="btn btn-outline-light btn-sm" onclick="openCart()">ดูตะกร้า</button>
    <button class="btn btn-red" onclick="submitOrder()" id="btnSend">ส่งออเดอร์ 🍣</button>
  </div>
</div>

<!-- ============================================ ตะกร้า -->
<div class="offcanvas offcanvas-bottom" id="cartCanvas" style="height:auto;max-height:86vh;border-radius:22px 22px 0 0">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title">ตะกร้าของคุณ 🛒</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <div id="cartLines"></div>
    <div class="mt-3">
      <label class="form-label small">หมายเหตุถึงครัว (ทั้งออเดอร์)</label>
      <input id="orderNote" class="form-control" placeholder="เช่น ไม่ใส่วาซาบิ / แยกจาน">
    </div>
    <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
      <div>
        <div class="small text-muted-t">รวมรอบนี้</div>
        <div style="font-family:Poppins,sans-serif;font-weight:600;font-size:1.4rem" id="cartTotal2">฿0</div>
      </div>
      <button class="btn btn-red btn-lg" onclick="submitOrder()">ส่งออเดอร์เข้าครัว</button>
    </div>
  </div>
</div>

<!-- ============================================ ออเดอร์ของฉัน -->
<div class="offcanvas offcanvas-bottom" id="ordersCanvas" style="height:auto;max-height:86vh;border-radius:22px 22px 0 0">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title">ออเดอร์ของฉัน 🧾</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body" id="ordersBody"></div>
</div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/menu.js"></script>
<script>
(async () => { await API.init(); custStart(); })();
</script>
</body>
</html>
