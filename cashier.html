<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แคชเชียร์ | Tsuki Sushi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/images/logo-mark.svg">
<link href="assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="topbar"></div>

<main class="container py-4">
  <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
    <div>
      <h4 class="mb-1">💳 แคชเชียร์</h4>
      <p class="text-muted-t small mb-0">เลือกโต๊ะทางซ้ายเพื่อดูบิลและรับชำระเงิน · โต๊ะที่กดเรียกเก็บเงินจะขึ้นก่อน</p>
    </div>
    <div class="ms-auto d-flex align-items-center gap-2">
      <span class="tag tag-cooking">รอเก็บเงิน <b id="cntBilling">0</b></span>
      <span class="tag tag-new">กำลังทาน <b id="cntOpen">0</b></span>
      <button class="btn btn-ghost btn-sm" onclick="cashLoad()">🔄</button>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-4">
      <div class="panel">
        <h6 class="mb-3">โต๊ะทั้งหมด</h6>
        <div id="tableList"><div class="spinner-t"></div></div>
      </div>
      <div class="panel mt-3">
        <h6 class="mb-2">ยอดวันนี้</h6>
        <div class="d-flex justify-content-between"><span class="text-muted-t">บิลที่ปิดแล้ว</span><b id="todayBills">–</b></div>
        <div class="d-flex justify-content-between"><span class="text-muted-t">ยอดขายรวม</span><b class="text-red" id="todayRevenue">–</b></div>
      </div>
    </div>

    <div class="col-lg-8">
      <div id="billPane">
        <div class="panel text-center py-5 text-muted-t">
          <div style="font-size:3rem">🧾</div>
          <p class="mb-0 mt-2">เลือกโต๊ะทางซ้ายเพื่อดูบิล</p>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ============================================ รับชำระเงิน -->
<div class="modal fade" id="payModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:24px;border:0">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title">รับชำระเงิน</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="text-center mb-3">
          <div class="small text-muted-t">ยอดที่ต้องชำระ</div>
          <div style="font-family:Poppins,sans-serif;font-weight:600;font-size:2.4rem" class="text-red" id="payTotal">฿0</div>
          <div class="small text-muted-t" id="payTable"></div>
        </div>

        <label class="form-label small">ส่วนลด (฿)</label>
        <input id="payDiscount" class="form-control mb-3" type="number" min="0" value="0" oninput="recalcPay()">

        <label class="form-label small">วิธีชำระ</label>
        <div class="d-flex gap-2 flex-wrap mb-3" id="payMethods"></div>

        <div id="cashBox">
          <label class="form-label small">รับเงินมา (฿)</label>
          <input id="cashGot" class="form-control form-control-lg text-center" type="number" min="0" inputmode="decimal" oninput="recalcPay()">
          <div class="d-flex flex-wrap gap-2 mt-2" id="cashQuick"></div>
          <div class="d-flex justify-content-between mt-3 fs-5"><span>เงินทอน</span><b class="text-red" id="payChange">฿0</b></div>
        </div>
        <div id="refBox" class="d-none">
          <label class="form-label small">เลขอ้างอิง (ไม่บังคับ)</label>
          <input id="payRef" class="form-control" placeholder="เลขที่รายการโอน / 4 ตัวท้ายบัตร">
        </div>
        <div id="payErr" class="alert alert-danger py-2 small mt-3 d-none"></div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">ยกเลิก</button>
        <button type="button" class="btn btn-red px-4" id="btnPay" onclick="doCheckout()">ยืนยันรับเงิน</button>
      </div>
    </div>
  </div>
</div>

<!-- ============================================ ใบเสร็จ -->
<div class="modal fade" id="receiptModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:24px;border:0">
      <div class="modal-body p-4"><div id="receipt" class="receipt"></div></div>
      <div class="modal-footer border-0 pt-0 justify-content-between">
        <button class="btn btn-outline-t" onclick="window.print()">🖨️ พิมพ์ใบเสร็จ</button>
        <button class="btn btn-red px-4" onclick="closeReceipt()">เสร็จสิ้น</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cashier.js"></script>
<script>
(async () => {
  await API.init();
  mountTopbar('cashier');
  if (!API.require('cashier', ['cashier'])) return;
  cashStart();
})();
</script>
</body>
</html>
