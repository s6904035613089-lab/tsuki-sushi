      <stop offset="0" stop-color="#2a3154"/><stop offset="1" stop-color="#151a33"/>
    </linearGradient>
    <radialGradient id="dish" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ece4d6"/>
