<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เปิดโต๊ะ / สร้าง QR | Tsuki Sushi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/images/logo-mark.svg">
<link href="assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="topbar"></div>

<main class="container py-4">
  <div class="row g-4">
    <!-- ============================ ซ้าย: เลือกโต๊ะ -->
    <div class="col-lg-7">
      <h4 class="mb-1">เปิดโต๊ะให้ลูกค้า</h4>
      <p class="text-muted-t small mb-3">เลือกโต๊ะ → ใส่จำนวนคน → กดเปิดโต๊ะ ระบบจะสร้าง QR ให้ลูกค้าสแกนสั่งอาหาร</p>

      <div class="panel mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="mb-0">1. เลือกโต๊ะ</h6>
          <div class="small text-muted-t">
            <span class="tag tag-out">แดง</span> = มีลูกค้าอยู่
          </div>
        </div>
        <div id="zones"><div class="spinner-t"></div></div>
      </div>

      <div class="panel">
        <h6 class="mb-3">2. จำนวนลูกค้า</h6>
        <div class="d-flex align-items-center gap-2 flex-wrap mb-3" id="guestQuick"></div>
        <div class="d-flex align-items-center gap-3">
          <div class="stepper">
            <button class="step-btn" onclick="bumpGuests(-1)">−</button>
            <input id="guests" class="form-control text-center" type="number" min="1" max="30" value="2" style="width:84px">
            <button class="step-btn plus" onclick="bumpGuests(1)">+</button>
          </div>
          <span class="text-muted-t small">ท่าน</span>
        </div>
        <button class="btn btn-red btn-lg w-100 mt-4" id="btnOpen" onclick="openTable()" disabled>
          🪑 เปิดโต๊ะ &amp; สร้าง QR
        </button>
        <div id="openErr" class="alert alert-danger py-2 small mt-3 d-none"></div>
      </div>
    </div>

    <!-- ============================ ขวา: โต๊ะที่เปิดอยู่ -->
    <div class="col-lg-5">
      <div class="panel">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="mb-0">โต๊ะที่กำลังใช้งาน</h6>
          <button class="btn btn-ghost btn-sm" onclick="loadAll()">🔄</button>
        </div>
        <div id="openList"><div class="spinner-t"></div></div>
      </div>
    </div>
  </div>
</main>

<!-- ============================================ QR -->
<div class="modal fade" id="qrModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:24px;border:0">
      <div class="modal-body p-4">
        <div id="qrCard" class="qr-box">
          <img src="assets/images/logo.svg" alt="Tsuki Sushi" style="height:52px">
          <div class="mt-2" style="font-size:.86rem;color:var(--muted)">สแกนเพื่อดูเมนูและสั่งอาหาร</div>
          <div class="my-3 d-flex justify-content-center" id="qrCanvas"></div>
          <div style="font-family:Poppins,sans-serif;font-weight:600;font-size:2rem;line-height:1" id="qrTable">–</div>
          <div class="text-muted-t small" id="qrMeta">–</div>
          <div class="mt-2" style="font-size:.7rem;color:var(--muted);word-break:break-all" id="qrUrl"></div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-outline-t flex-fill" onclick="printQR()">🖨️ พิมพ์</button>
          <button class="btn btn-outline-t flex-fill" onclick="copyLink()">🔗 คัดลอกลิงก์</button>
          <button class="btn btn-ink flex-fill" data-bs-dismiss="modal">เสร็จแล้ว</button>
        </div>
        <div class="text-center mt-2">
          <a class="small text-muted-t" id="qrOpenLink" target="_blank" rel="noopener">เปิดหน้าลูกค้าเพื่อทดสอบ ↗</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/supabase.min.js"></script>
<script src="assets/vendor/qrcode.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/host.js"></script>
<script>
(async () => {
  await API.init();
  mountTopbar('host');
  if (!API.require('host', ['waiter', 'cashier'])) return;
  loadAll();
})();
</script>
</body>
</html>
